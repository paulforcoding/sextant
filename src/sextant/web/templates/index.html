<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sextant</title>
<style>
  :root {
    --bg: #0d0d12;
    --sidebar: #13131b;
    --card: #1a1a26;
    --card-hover: #22223a;
    --border: #25253a;
    --text: #c8c8d4;
    --text-dim: #6b6b80;
    --accent: #7c8cf8;
    --accent-glow: #9dacff;
    --user-bubble: #252540;
    --agent-bubble: #1a1e30;
    --tool-bg: #141420;
    --thinking: #4a4a60;
    --success: #4ade80;
    --error: #f87171;
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    position: relative;
  }

  .sidebar-header {
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }

  .sidebar-header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
  }

  .sidebar-header .sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
    font-family: "SF Mono", "Fira Code", monospace;
  }

  .sidebar-section {
    padding: 8px 20px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    font-weight: 600;
  }

  .sidebar-list {
    list-style: none;
    padding: 0 12px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background var(--transition);
    margin-bottom: 2px;
    font-size: 14px;
  }

  .sidebar-item:hover { background: var(--card-hover); }
  .sidebar-item.active { background: var(--card); color: #fff; }

  .sidebar-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .sidebar-item .badge {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    min-width: 20px;
    text-align: center;
  }

  .sidebar-item .icon {
    font-size: 16px;
    flex-shrink: 0;
    width: 20px;
    text-align: center;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-footer .status-text {
    flex: 1;
    min-width: 0;
  }

  /* ── Settings button ── */
  .settings-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
  }

  .settings-btn:hover {
    background: var(--card-hover);
    color: #fff;
    border-color: var(--accent);
  }

  /* ── Settings popup ── */
  .settings-popup {
    position: absolute;
    bottom: 52px;
    left: 20px;
    right: 20px;
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: none;
    animation: fadeIn 0.15s ease;
  }

  .settings-popup.visible { display: block; }

  .settings-popup h3 {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .settings-popup .close-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color var(--transition);
  }

  .settings-popup .close-btn:hover { color: #fff; }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }

  .setting-row .label {
    font-size: 13px;
    color: var(--text);
  }

  /* ── Toggle switch ── */
  .toggle-switch {
    position: relative;
    width: 40px; height: 22px;
    flex-shrink: 0;
  }

  .toggle-switch input {
    opacity: 0; width: 0; height: 0;
  }

  .toggle-slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--border);
    border-radius: 22px;
    transition: background var(--transition);
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform var(--transition);
  }

  .toggle-switch input:checked + .toggle-slider {
    background: var(--accent);
  }

  .toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(18px);
  }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    flex-shrink: 0;
  }

  /* ── Content wrapper ── */
  #content {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Chat area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .header h2 {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
  }

  .header .status {
    font-size: 12px;
    color: var(--text-dim);
    font-family: "SF Mono", "Fira Code", monospace;
  }

  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Messages ── */
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14px;
    animation: fadeIn 0.2s ease;
    word-break: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
  }

  .msg.agent {
    align-self: flex-start;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg.thinking {
    align-self: flex-start;
    background: transparent;
    border: none;
    color: var(--thinking);
    font-style: italic;
    font-size: 13px;
    padding: 4px 8px;
  }

  .msg.tool {
    align-self: flex-start;
    background: var(--tool-bg);
    border: 1px solid var(--border);
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 13px;
    padding: 8px 14px;
  }

  .msg.tool .tool-name {
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .msg.tool .tool-detail {
    color: var(--text-dim);
    white-space: pre-wrap;
    max-height: 120px;
    overflow-y: auto;
  }

  .msg.tool-result {
    align-self: flex-start;
    background: var(--tool-bg);
    border: 1px solid var(--border);
    font-size: 13px;
    padding: 8px 14px;
    color: var(--success);
  }

  .msg.tool-result.error { color: var(--error); }

  .msg .role-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── Input ── */
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
    background: var(--bg);
  }

  .input-area textarea {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    outline: none;
    transition: border var(--transition);
  }

  .input-area textarea:focus { border-color: var(--accent); }

  .input-area button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition);
  }

  .input-area button:hover { background: var(--accent-glow); }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Mailbox view ── */
  .mailbox-view {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
  }

  .mailbox-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    transition: background var(--transition);
  }

  .mailbox-card:hover { background: var(--card-hover); }

  .mailbox-card .mb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .mailbox-card .mb-from-to {
    font-weight: 600;
    color: #fff;
    font-size: 14px;
  }

  .mailbox-card .mb-arrow { color: var(--accent); margin: 0 6px; }

  .mailbox-card .mb-time {
    font-size: 12px;
    color: var(--text-dim);
    font-family: "SF Mono", "Fira Code", monospace;
  }

  .mailbox-card .mb-subject {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-glow);
    margin-bottom: 6px;
  }

  .mailbox-card .mb-body {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .mailbox-card .mb-status {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
  }

  .mb-status.pending { background: rgba(124, 140, 248, 0.15); color: var(--accent); }
  .mb-status.delivered { background: rgba(74, 222, 128, 0.15); color: var(--success); }

  /* ── Empty state ── */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    gap: 12px;
  }

  .empty .icon { font-size: 48px; }
  .empty h3 { font-size: 18px; color: #fff; }
  .empty p { font-size: 14px; }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .streaming-indicator {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 0.8s infinite;
    margin-right: 6px;
  }

  /* ── Cost bar ── */
  .cost-bar {
    font-size: 12px;
    color: var(--text-dim);
    padding: 4px 16px;
    font-family: "SF Mono", "Fira Code", monospace;
    align-self: flex-start;
  }
</style>
</head>
<body>

<!-- ═══════════ SIDEBAR ═══════════ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>sextant</h1>
    <div class="sub">multi-agent cockpit</div>
  </div>

  <div class="sidebar-section">Agents</div>
  <ul class="sidebar-list" id="agent-list">
    <li class="sidebar-item" style="color:var(--text-dim)">加载中...</li>
  </ul>

  <div class="sidebar-section">Messages</div>
  <ul class="sidebar-list">
    <li class="sidebar-item" data-view="mailbox" onclick="showMailbox()">
      <span class="icon">📬</span> Mailbox
    </li>
  </ul>

  <div class="sidebar-footer" id="sidebar-footer">
    <span class="status-text">—</span>
    <button class="settings-btn" onclick="toggleSettings()" title="设置">⚙</button>
  </div>

  <!-- Settings popup -->
  <div class="settings-popup" id="settings-popup">
    <h3>
      设置
      <button class="close-btn" onclick="toggleSettings()">✕</button>
    </h3>
    <div class="setting-row">
      <span class="label">显示思考过程</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-thinking" onchange="updateThinkingSetting()" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
</aside>

<!-- ═══════════ MAIN ═══════════ -->
<main class="main">
  <div class="header" id="header">
    <h2 id="header-title">sextant</h2>
    <span class="status" id="header-status"></span>
  </div>

  <div id="content">
    <div class="empty">
      <div class="icon">⚓</div>
      <h3>选择一个 Agent 开始</h3>
      <p>点击左侧 Agent 进入对话，或查看 Mailbox</p>
    </div>
  </div>
</main>

<script>
// ══════════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════════
let activeProject = null;
let activeView = null;        // 'chat' | 'mailbox'
let streamingAbort = null;
const chatCache = {};         // projectId → messages.innerHTML (preserved across switches)
let showThinking = true;      // settings: show LLM thinking blocks

// ══════════════════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════════════════
async function init() {
  // Load saved settings
  try {
    const saved = localStorage.getItem('sextant_showThinking');
    if (saved !== null) {
      showThinking = saved === 'true';
      document.getElementById('toggle-thinking').checked = showThinking;
    }
  } catch (_) {}

  try {
    const res = await fetch('/api/projects');
    const projects = await res.json();
    renderAgentList(projects);
    const footerText = document.querySelector('#sidebar-footer .status-text');
    if (footerText) {
      footerText.textContent = `${projects.length} agent${projects.length>1?'s':''} ready`;
    }
  } catch (e) {
    document.getElementById('agent-list').innerHTML =
      '<li class="sidebar-item" style="color:var(--error)">连接失败</li>';
  }
}

function renderAgentList(projects) {
  const list = document.getElementById('agent-list');
  list.innerHTML = projects.map(p => `
    <li class="sidebar-item" data-view="chat" data-project="${p.id}" onclick="selectAgent('${p.id}')">
      <span class="dot"></span>
      ${p.id}
      ${p.pending > 0 ? `<span class="badge">${p.pending}</span>` : ''}
    </li>
  `).join('');
}

// ══════════════════════════════════════════════════════════════
// Agent selection
// ══════════════════════════════════════════════════════════════
async function selectAgent(projectId) {
  // Abort any active stream
  if (streamingAbort) { streamingAbort.abort(); streamingAbort = null; }

  // Save current chat HTML to cache before switching away
  if (activeProject && activeView === 'chat') {
    const msgs = document.getElementById('messages');
    if (msgs && msgs.children.length > 0) {
      chatCache[activeProject] = msgs.innerHTML;
    }
  }

  activeProject = projectId;
  activeView = 'chat';

  // Highlight sidebar
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-project="${projectId}"]`)?.classList.add('active');

  // Header
  document.getElementById('header-title').textContent = projectId;
  document.getElementById('header-status').textContent = '';

  // Build chat UI
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="chat-area" id="messages"></div>
    <form class="input-area" id="input-row" onsubmit="event.preventDefault(); sendMessage(); return false;">
      <textarea id="prompt-input" rows="1"
        placeholder="输入消息..."></textarea>
      <button id="send-btn" type="submit">发送</button>
    </form>
  `;

  const container = document.getElementById('messages');

  // Restore from cache if we've visited this agent before
  if (chatCache[projectId]) {
    container.innerHTML = chatCache[projectId];
    document.getElementById('header-status').textContent = '已恢复';
    scrollToBottom();
    // Silently refresh history to catch CLI-originated messages
    refreshHistory(projectId);
    return;
  }

  // First visit: load history from disk
  document.getElementById('header-status').textContent = '加载历史...';
  try {
    const res = await fetch(`/api/chat/${projectId}/history`);
    const msgs = await res.json();
    if (msgs.length === 0) {
      container.innerHTML = '<div class="empty"><p>新对话 — 输入消息开始</p></div>';
    } else {
      msgs.forEach(m => appendMessage(m.role, m.content));
    }
    document.getElementById('header-status').textContent =
      `${msgs.length} 条历史消息`;
  } catch (e) {
    document.getElementById('header-status').textContent = '加载失败';
  }

  scrollToBottom();
}

// ══════════════════════════════════════════════════════════════
// Background history refresh (catches CLI-originated messages)
// ══════════════════════════════════════════════════════════════
async function refreshHistory(projectId) {
  try {
    const res = await fetch(`/api/chat/${projectId}/history`);
    const msgs = await res.json();
    if (!Array.isArray(msgs) || msgs.length === 0) return;

    // Rebuild cache HTML from history data
    // Use a temporary container so we don't disrupt the visible DOM
    const tmp = document.createElement('div');
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = `msg ${m.role}`;
      div.innerHTML = m.role === 'user'
        ? `<div class="role-label">YOU</div><div class="msg-content">${esc(m.content)}</div>`
        : `<div class="role-label">${esc(projectId)}</div><div class="msg-content">${esc(m.content)}</div>`;
      tmp.appendChild(div);
    });
    chatCache[projectId] = tmp.innerHTML;
  } catch (_) {
    // Silently ignore — cache from web session is good enough
  }
}

// ══════════════════════════════════════════════════════════════
// Send message
// ══════════════════════════════════════════════════════════════
async function sendMessage() {
  if (!activeProject) return;

  const input = document.getElementById('prompt-input');
  const btn = document.getElementById('send-btn');
  const prompt = input.value.trim();
  if (!prompt) return;

  // ── Slash commands ──
  if (prompt.startsWith('/')) {
    input.value = '';
    input.style.height = 'auto';
    appendMessage('user', prompt);

    const spaceIdx = prompt.indexOf(' ');
    const cmd = spaceIdx > 0 ? prompt.slice(0, spaceIdx) : prompt;

    switch (cmd) {
      case '/agents':
        await handleAgents();
        break;
      case '/mcp':
        await handleMcp();
        break;
      default:
        appendSystem(`未知命令: ${cmd}\n\n可用命令: /agents, /mcp`);
    }
    return;
  }

  // Clear input
  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;

  // Append user message
  appendMessage('user', prompt);
  scrollToBottom();

  // Start SSE
  streamingAbort = new AbortController();
  document.getElementById('header-status').innerHTML =
    '<span class="streaming-indicator"></span>处理中...';

  try {
    // POST prompt
    await fetch(`/api/chat/${activeProject}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt}),
    });

    // SSE stream
    const res = await fetch(`/api/chat/${activeProject}/stream`, {
      signal: streamingAbort.signal,
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let agentMsg = null;
    let cost = null;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));

          switch (data.type) {
            case 'text':
              if (!agentMsg) {
                agentMsg = appendMessage('agent', '');
              }
              agentMsg.querySelector('.msg-content').textContent += data.content;
              break;

            case 'thinking':
              if (showThinking) {
                appendMessage('thinking', data.content);
              }
              break;

            case 'tool_use':
              appendMessage('tool', null, {
                name: data.name,
                input: data.input,
              });
              break;

            case 'tool_result':
              appendMessage('tool-result', data.content, {
                is_error: data.is_error,
              });
              break;

            case 'server_tool':
              appendMessage('tool', `🔧 ${data.name}`, {
                name: data.name,
                input: data.input,
              });
              break;

            case 'server_tool_result':
              appendMessage('tool-result', JSON.stringify(data.content).slice(0, 500));
              break;

            case 'done':
              cost = data.cost;
              document.getElementById('header-status').textContent =
                cost != null
                  ? `完成 · $${cost.toFixed(4)} · ${data.elapsed}s`
                  : `完成 · ${data.elapsed}s`;
              if (cost != null) {
                appendCost(cost, data.elapsed);
              }
              break;

            case 'error':
              appendMessage('agent', `❌ ${data.message}`);
              document.getElementById('header-status').textContent = '错误';
              break;
          }
        } catch (_) {}
      }
      scrollToBottom();
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      appendMessage('agent', `❌ 连接错误: ${e.message}`);
      document.getElementById('header-status').textContent = '连接错误';
    }
  } finally {
    btn.disabled = false;
    streamingAbort = null;
    document.getElementById('prompt-input')?.focus();
  }
}

// ══════════════════════════════════════════════════════════════
// Append message to chat
// ══════════════════════════════════════════════════════════════
function appendMessage(type, content, extra) {
  const container = document.getElementById('messages');
  if (!container) return null;

  // Remove empty state
  const empty = container.querySelector('.empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = `msg ${type}`;

  switch (type) {
    case 'user':
      div.innerHTML = `<div class="role-label">YOU</div><div class="msg-content">${esc(content)}</div>`;
      break;
    case 'agent':
      div.innerHTML = `<div class="role-label">${activeProject||'agent'}</div><div class="msg-content">${esc(content)}</div>`;
      break;
    case 'thinking':
      if (!showThinking) return null;
      div.innerHTML = `💭 ${esc(content)}`;
      break;
    case 'tool':
      const cmdLine = extra?.name === 'Bash' && extra?.input?.command
        ? extra.input.command
        : extra?.name === 'send_message'
        ? `📬 → ${extra?.input?.to}: ${extra?.input?.subject}`
        : formatToolInput(extra?.input);
      div.innerHTML = `
        <div class="tool-name">⚙ ${extra?.name || 'tool'}</div>
        ${cmdLine ? `<div class="tool-detail">${esc(cmdLine)}</div>` : ''}
      `;
      break;
    case 'tool-result':
      div.classList.add(type);
      if (extra?.is_error) div.classList.add('error');
      div.innerHTML = `<span>${extra?.is_error ? '❌' : '✓'} ${esc(String(content).slice(0, 300))}</span>`;
      break;
  }

  container.appendChild(div);
  return div;
}

function appendCost(cost, elapsed) {
  const container = document.getElementById('messages');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'cost-bar';
  div.textContent = `$${cost.toFixed(4)} · ${elapsed}s`;
  container.appendChild(div);
}

// ══════════════════════════════════════════════════════════════
// Mailbox view
// ══════════════════════════════════════════════════════════════
async function showMailbox() {
  if (streamingAbort) { streamingAbort.abort(); streamingAbort = null; }

  activeProject = null;
  activeView = 'mailbox';

  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.querySelector('[data-view="mailbox"]')?.classList.add('active');

  document.getElementById('header-title').textContent = 'Mailbox';
  document.getElementById('header-status').textContent = '加载中...';

  const content = document.getElementById('content');
  content.innerHTML = '<div class="mailbox-view" id="mailbox-list">加载中...</div>';

  try {
    const res = await fetch('/api/mailbox');
    const entries = await res.json();
    const list = document.getElementById('mailbox-list');

    if (entries.length === 0) {
      list.innerHTML = '<div class="empty"><div class="icon">📭</div><h3>暂无消息</h3></div>';
    } else {
      list.innerHTML = entries.map(e => `
        <div class="mailbox-card">
          <div class="mb-header">
            <span class="mb-from-to">${esc(e.from)} <span class="mb-arrow">→</span> ${esc(e.to)}</span>
            <span class="mb-time">${fmtTime(e.timestamp)}</span>
          </div>
          <div class="mb-subject">${esc(e.subject)}</div>
          <div class="mb-body">${esc(e.body)}</div>
          <div style="margin-top:8px">
            <span class="mb-status ${e.status||'pending'}">${e.status||'pending'}</span>
            ${e.reply ? `<div style="margin-top:8px;font-size:13px;color:var(--text-dim)">↩ ${esc(e.reply).slice(0, 200)}</div>` : ''}
          </div>
        </div>
      `).join('');
    }
    document.getElementById('header-status').textContent = `${entries.length} 条消息`;
  } catch (e) {
    document.getElementById('mailbox-list').innerHTML = `<div class="empty"><p>加载失败: ${e.message}</p></div>`;
  }
}

// ══════════════════════════════════════════════════════════════
// Slash command handlers
// ══════════════════════════════════════════════════════════════

async function handleAgents() {
  try {
    const res = await fetch('/api/agents');
    const data = await res.json();
    const agents = data.agents || [];

    if (agents.length === 0) {
      appendSystem('没有配置任何 Agent。');
      return;
    }

    let html = `<table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr style="color:var(--text-dim);border-bottom:1px solid var(--border)">
        <th style="text-align:left;padding:6px 8px">ID</th>
        <th style="text-align:left;padding:6px 8px">Directory</th>
        <th style="text-align:left;padding:6px 8px">Session</th>
        <th style="text-align:center;padding:6px 8px">状态</th>
      </tr>`;

    for (const a of agents) {
      const session = a.session_id
        ? `<span style="font-family:monospace;font-size:11px">${a.session_id.slice(0, 12)}...</span>`
        : (a.continue ? '<span style="color:var(--text-dim)">latest</span>'
                       : '<span style="color:var(--text-dim)">new each</span>');
      const status = a.ready
        ? '<span style="color:var(--success)">● ready</span>'
        : '<span style="color:var(--error)">○ starting</span>';

      html += `<tr style="border-bottom:1px solid rgba(37,37,58,0.5)">
        <td style="padding:6px 8px;font-weight:600;color:#fff">${esc(a.id)}</td>
        <td style="padding:6px 8px;color:var(--text-dim);font-family:monospace;font-size:12px">${esc(a.directory)}</td>
        <td style="padding:6px 8px">${session}</td>
        <td style="padding:6px 8px;text-align:center">${status}</td>
      </tr>`;
    }
    html += '</table>';
    html += `<div style="margin-top:8px;font-size:12px;color:var(--text-dim)">共 ${agents.length} 个 Agent</div>`;

    appendSystem(html, true);
  } catch (e) {
    appendSystem(`❌ 获取 Agent 列表失败: ${e.message}`);
  }
}

async function handleMcp() {
  if (!activeProject) {
    appendSystem('请先选择一个 Agent。');
    return;
  }

  try {
    const res = await fetch(`/api/chat/${activeProject}/mcp`);
    if (!res.ok) {
      appendSystem(`❌ ${res.status}: ${(await res.json()).error || '未知错误'}`);
      return;
    }
    const data = await res.json();
    const servers = data.servers || [];

    if (servers.length === 0) {
      appendSystem('没有配置任何 MCP 服务器。');
      return;
    }

    let html = '';
    for (const srv of servers) {
      const statusIcon = srv.status === 'connected'
        ? '<span style="color:var(--success)">●</span>'
        : srv.status === 'starting'
        ? '<span style="color:#facc15">○</span>'
        : '<span style="color:var(--text-dim)">○</span>';

      html += `<div style="margin-bottom:16px;padding:12px;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          ${statusIcon}
          <span style="font-weight:600;color:#fff;font-size:14px">${esc(srv.name)}</span>
          <span style="font-size:11px;color:var(--text-dim);margin-left:auto">${esc(srv.source)}</span>
        </div>`;

      if (srv.command) {
        html += `<div style="font-family:monospace;font-size:12px;color:var(--text-dim);margin-bottom:6px">
          $ ${esc(srv.command)} ${(srv.args || []).map(esc).join(' ')}
        </div>`;
      }

      const tools = srv.tools || [];
      html += `<div style="font-size:12px;color:var(--text-dim);margin-bottom:4px">${tools.length} tool(s):</div>`;
      for (const t of tools) {
        html += `<div style="font-size:13px;padding:4px 8px;margin:2px 0;background:var(--tool-bg);border-radius:4px">
          <code style="color:var(--accent)">${esc(t.name)}</code>`;
        if (t.description) {
          html += ` <span style="color:var(--text-dim)">— ${esc(t.description)}</span>`;
        }
        if (t.parameters && t.parameters.length > 0) {
          html += ` <span style="color:var(--thinking);font-size:11px">(${esc(t.parameters.join(', '))})</span>`;
        }
        html += '</div>';
      }
      html += '</div>';
    }

    html += `<div style="font-size:12px;color:var(--text-dim);margin-top:4px">
      共 ${data.total_servers} 个服务器，${data.total_tools} 个工具
    </div>`;

    appendSystem(html, true);
  } catch (e) {
    appendSystem(`❌ 获取 MCP 信息失败: ${e.message}`);
  }
}

function appendSystem(content, isHtml = false) {
  const container = document.getElementById('messages');
  if (!container) return;
  const empty = container.querySelector('.empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'msg system';
  div.style.cssText = 'align-self:flex-start;background:var(--tool-bg);'
    + 'border:1px solid rgba(124,140,248,0.3);padding:12px 16px;'
    + 'border-radius:var(--radius);max-width:100%;font-size:13px';
  if (isHtml) {
    div.innerHTML = content;
  } else {
    div.innerHTML = esc(content);
  }
  container.appendChild(div);
  scrollToBottom();
  return div;
}

// ══════════════════════════════════════════════════════════════
// Settings
// ══════════════════════════════════════════════════════════════
function toggleSettings() {
  const popup = document.getElementById('settings-popup');
  popup.classList.toggle('visible');
}

function updateThinkingSetting() {
  showThinking = document.getElementById('toggle-thinking').checked;
  try {
    localStorage.setItem('sextant_showThinking', String(showThinking));
  } catch (_) {}
}

// Close popup when clicking outside
document.addEventListener('click', (e) => {
  const popup = document.getElementById('settings-popup');
  if (!popup || !popup.classList.contains('visible')) return;
  const btn = document.querySelector('.settings-btn');
  if (!popup.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
    popup.classList.remove('visible');
  }
});

// ══════════════════════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════════════════════
function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

function formatToolInput(input) {
  if (!input || typeof input !== 'object') return '';
  if (Object.keys(input).length === 0) return '';
  // Single key with string value — show it directly
  const keys = Object.keys(input);
  if (keys.length === 1 && typeof input[keys[0]] === 'string') {
    return `${keys[0]}: ${input[keys[0]]}`;
  }
  // Multiple keys or non-string values — compact JSON
  try {
    const s = JSON.stringify(input);
    return s.length > 300 ? s.slice(0, 297) + '...' : s;
  } catch (_) { return ''; }
}

function fmtTime(ts) {
  if (!ts) return '';
  return ts.replace('T', ' ').split('+')[0].split('.')[0];
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    const area = document.getElementById('messages');
    if (area) area.scrollTop = area.scrollHeight;
  });
}

// Auto-resize textarea
document.addEventListener('input', (e) => {
  if (e.target.id === 'prompt-input') {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }
});

// Enter to send (Shift+Enter for newline). e.isComposing guards against IME.
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'prompt-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});

// ══════════════════════════════════════════════════════════════
// Periodic refresh of agent list (pending counts)
// ══════════════════════════════════════════════════════════════
setInterval(async () => {
  try {
    const res = await fetch('/api/projects');
    const projects = await res.json();
    renderAgentList(projects);
    // Keep active highlight
    if (activeProject) {
      document.querySelector(`[data-project="${activeProject}"]`)?.classList.add('active');
    }
    if (activeView === 'mailbox') {
      document.querySelector('[data-view="mailbox"]')?.classList.add('active');
    }
  } catch (_) {}
}, 5000);

// Start
init();
</script>
