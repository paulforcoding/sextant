<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sextant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ═══════════ SIDEBAR ═══════════ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>sextant</h1>
    <div class="sub">multi-agent cockpit</div>
  </div>

  <div class="sidebar-section">Agents</div>
  <ul class="sidebar-list" id="agent-list">
    <li class="sidebar-item" style="color:var(--text-dim)">加载中...</li>
  </ul>

  <div class="sidebar-section">Messages</div>
  <ul class="sidebar-list">
    <li class="sidebar-item" data-view="mailbox" onclick="showMailbox()">
      <span class="icon">📬</span> Mailbox
    </li>
  </ul>

  <div class="sidebar-footer" id="sidebar-footer">
    <span class="status-text">—</span>
    <button class="settings-btn" onclick="toggleSettings()" title="设置">⚙</button>
  </div>

  <!-- Settings popup -->
  <div class="settings-popup" id="settings-popup">
    <h3>
      设置
      <button class="close-btn" onclick="toggleSettings()">✕</button>
    </h3>
    <div class="setting-row">
      <span class="label">显示思考过程</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-thinking" onchange="updateThinkingSetting()" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <span class="label">权限模式</span>
      <select id="perm-mode-select" onchange="updatePermSetting()" class="setting-select">
        <option value="bypassPermissions">全部放行</option>
        <option value="acceptEdits">自动通过编辑</option>
        <option value="default">标准（弹窗审批）</option>
        <option value="plan">Plan 模式（只读）</option>
      </select>
    </div>
  </div>
</aside>

<!-- ═══════════ MAIN ═══════════ -->
<main class="main">
  <div class="header" id="header">
    <h2 id="header-title">sextant</h2>
    <span class="status" id="header-status"></span>
  </div>

  <div id="content">
    <div class="empty">
      <div class="icon">⚓</div>
      <h3>选择一个 Agent 开始</h3>
      <p>点击左侧 Agent 进入对话，或查看 Mailbox</p>
    </div>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
