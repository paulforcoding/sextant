# sextant configuration
# Phase 5: permission mode + session resume support

# Global permission mode (can be overridden per-project)
# Options: acceptEdits (default), default, plan
# permission_mode: acceptEdits

projects:
  - id: test-project
    directory: /tmp/sextant-demo
    # Optional: restrict allowed tools during testing
    # allowed_tools: [Read, Write, Edit, Bash]
    # Optional: per-project permission override
    # permission_mode: default
  - id: acp
    directory: /tmp/acp
  - id: ncp
    directory: /tmp/ncp
  - id: xcp
    directory: /tmp/xcp
